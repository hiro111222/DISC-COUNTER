<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style"
content="black-translucent">

<meta name="theme-color" content="#26951b">

<title>Disc Counter</title>

<style>

html, body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;
    min-height: 100dvh;

    overflow: hidden;

    background: #26951b;

    touch-action: none;

    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;

    font-family: Helvetica, Arial, sans-serif;
}


/* =========================
   フィールド
========================= */

#field {
    position: fixed;
    inset: 0;

    background: #26951b;
}


/* =========================
   軌跡Canvas
========================= */

#trailCanvas {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    z-index: 5;
}


/* =========================
   ボタン共通
========================= */

.control {
    position: fixed;

    z-index: 1000;

    border: none;

    color: white;

    height: 32px;

    border-radius: 5px;

    font-size: 15px;

    font-weight: bold;

    -webkit-appearance: none;
}


/* 9 */

#btn9 {
    top: calc(env(safe-area-inset-top) + 8px);

    left: 20px;

    width: 50px;

    background: #005a10;
}


/* 10 */

#btn10 {
    top: calc(env(safe-area-inset-top) + 8px);

    left: 80px;

    width: 50px;

    background: #005a10;
}


/* Clear */

#clear {
    top: calc(env(safe-area-inset-top) + 8px);

    right: 20px;

    width: 70px;

    background: #d11e1e;
}


/* 軌跡Clear */

#trailClear {
    top: calc(env(safe-area-inset-top) + 48px);

    right: 20px;

    width: 90px;

    background: #444;
}


/* =========================
   ディスク
========================= */

.disc {
    position: absolute;

    width: 32px;
    height: 32px;

    border-radius: 50%;

    background: white;

    transform:
        translate(-50%, -50%)
        scale(1);

    box-shadow:
        0 1px 2px
        rgba(0,0,0,.25);

    z-index: 10;

    animation:
        discPop .4s ease;
}


/* ディスクを置いた時の動き */

@keyframes discPop {

    0% {
        transform:
            translate(-50%, -50%)
            scale(1);
    }

    50% {
        transform:
            translate(-50%, -50%)
            scale(1.5);
    }

    100% {
        transform:
            translate(-50%, -50%)
            scale(1);
    }
}


/* =========================
   使用済みディスク
========================= */

.disc.used {
    opacity: .10;

    transition:
        opacity .5s;

    pointer-events: none;
}


/* =========================
   残り枚数
========================= */

#remaining {
    position: absolute;

    transform:
        translate(-50%, -50%);

    color:
        rgba(255,255,255,.5);

    font-size: 20px;

    pointer-events: none;

    z-index: 50;
}


/* =========================
   人 ★
========================= */

#person {
    position: absolute;

    left: 50%;
    top: 75%;

    width: 58px;
    height: 58px;

    transform:
        translate(-50%, -50%);

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 52px;

    color: #ffd900;

    text-shadow:
        0 2px 3px
        rgba(0,0,0,.5);

    z-index: 500;

    cursor: grab;

    touch-action: none;
}


/* ★をドラッグ中 */

#person.dragging {
    cursor: grabbing;

    transform:
        translate(-50%, -50%)
        scale(1.15);
}

</style>
</head>


<body>


<div id="field">

    <canvas id="trailCanvas"></canvas>

    <div id="remaining"></div>

    <div id="person">★</div>

</div>


<button
id="btn9"
class="control">
9
</button>


<button
id="btn10"
class="control">
10
</button>


<button
id="clear"
class="control">
Clear
</button>


<button
id="trailClear"
class="control">
軌跡Clear
</button>



<script>

/* =========================
   基本設定
========================= */

const field =
document.getElementById("field");


const remainingLabel =
document.getElementById("remaining");


const person =
document.getElementById("person");


const canvas =
document.getElementById("trailCanvas");


const ctx =
canvas.getContext("2d");



let selectedCount = 9;


/*
 現在有効なディスク
*/

let activeObjects = [];


/*
 使用済みも含む
 全ディスク
*/

let allObjects = [];


let labelX = 0;
let labelY = 0;



/* =========================
   Canvasサイズ設定
========================= */

function resizeCanvas() {

    const ratio =
        window.devicePixelRatio || 1;


    canvas.width =
        window.innerWidth * ratio;


    canvas.height =
        window.innerHeight * ratio;


    canvas.style.width =
        window.innerWidth + "px";


    canvas.style.height =
        window.innerHeight + "px";


    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );

}


resizeCanvas();



/* =========================
   音
========================= */

let audioContext = null;


function clickSound(
    frequency = 700,
    duration = .04
) {

    try {

        if (!audioContext) {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }


        const oscillator =
            audioContext.createOscillator();


        const gain =
            audioContext.createGain();


        oscillator.type =
            "sine";


        oscillator.frequency.value =
            frequency;


        gain.gain.setValueAtTime(
            .06,
            audioContext.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime +
            duration
        );


        oscillator.connect(gain);


        gain.connect(
            audioContext.destination
        );


        oscillator.start();


        oscillator.stop(
            audioContext.currentTime +
            duration
        );

    }
    catch(e) {

    }

}



/* =========================
   残り枚数表示
========================= */

function updateLabel() {

    const remaining =
        selectedCount -
        activeObjects.length;


    remainingLabel.textContent =
        remaining;


    remainingLabel.style.left =
        labelX + "px";


    remainingLabel.style.top =
        (labelY - 30) + "px";

}



/* =========================
   ディスク追加
========================= */

function addObject(x, y) {

    const object =
        document.createElement("div");


    object.className =
        "disc";


    object.style.left =
        x + "px";


    object.style.top =
        y + "px";


    field.appendChild(
        object
    );


    activeObjects.push(
        object
    );


    allObjects.push(
        object
    );



    /* -------------------------
       ディスクをタップ
    ------------------------- */

    object.addEventListener(
        "pointerdown",

        function(event) {

            event.stopPropagation();


            if (
                object.classList.contains(
                    "used"
                )
            ) {

                return;

            }


            /*
             使用済みにする
            */

            object.classList.add(
                "used"
            );


            /*
             カウント対象から外す
            */

            activeObjects =
                activeObjects.filter(
                    item =>
                    item !== object
                );


            labelX = x;
            labelY = y;


            updateLabel();


            clickSound(
                450,
                .05
            );

        }

    );


    labelX = x;
    labelY = y;


    updateLabel();


    clickSound(
        800,
        .04
    );

}



/* =========================
   フィールドをタップ
========================= */

field.addEventListener(
    "pointerdown",

    function(event) {

        /*
         ★の場合は
         ディスクを置かない
        */

        if (
            event.target === person
        ) {

            return;

        }


        addObject(
            event.clientX,
            event.clientY
        );

    }

);



/* =========================
   ★ドラッグ
========================= */

let dragging = false;

let previousX = 0;
let previousY = 0;



person.addEventListener(
    "pointerdown",

    function(event) {

        event.stopPropagation();


        dragging = true;


        person.classList.add(
            "dragging"
        );


        person.setPointerCapture(
            event.pointerId
        );


        previousX =
            event.clientX;


        previousY =
            event.clientY;

    }

);



person.addEventListener(
    "pointermove",

    function(event) {

        if (!dragging) {

            return;

        }


        const x =
            event.clientX;


        const y =
            event.clientY;



        /* =====================
           点線の軌跡
        ===================== */

        ctx.beginPath();


        ctx.moveTo(
            previousX,
            previousY
        );


        ctx.lineTo(
            x,
            y
        );


        /*
         白色・30%透明
        */

        ctx.strokeStyle =
            "rgba(255,255,255,0.30)";


        /*
         細い線
        */

        ctx.lineWidth = 2;


        /*
         点線設定

         5px線
         5px空白
        */

        ctx.setLineDash(
            [5,5]
        );


        ctx.lineCap =
            "round";


        ctx.lineJoin =
            "round";


        ctx.stroke();



        /* =====================
           ★を移動
        ===================== */

        person.style.left =
            x + "px";


        person.style.top =
            y + "px";


        previousX = x;
        previousY = y;

    }

);



/* =========================
   ★ドラッグ終了
========================= */

function stopPersonDrag() {

    dragging = false;


    person.classList.remove(
        "dragging"
    );

}



person.addEventListener(
    "pointerup",
    stopPersonDrag
);


person.addEventListener(
    "pointercancel",
    stopPersonDrag
);



/* =========================
   9
========================= */

document
.getElementById("btn9")
.addEventListener(
    "pointerdown",

    function(event) {

        event.stopPropagation();


        selectedCount = 9;


        updateLabel();

    }

);



/* =========================
   10
========================= */

document
.getElementById("btn10")
.addEventListener(
    "pointerdown",

    function(event) {

        event.stopPropagation();


        selectedCount = 10;


        updateLabel();

    }

);



/* =========================
   全Clear
========================= */

document
.getElementById("clear")
.addEventListener(
    "pointerdown",

    function(event) {

        event.stopPropagation();



        /*
         ディスクを全部削除
        */

        allObjects.forEach(

            object =>
                object.remove()

        );


        activeObjects = [];

        allObjects = [];


        selectedCount = 9;


        labelX = 0;
        labelY = 0;


        remainingLabel.textContent =
            "";


        /*
         軌跡も削除
        */

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        clickSound(
            350,
            .05
        );

    }

);



/* =========================
   軌跡だけClear
========================= */

document
.getElementById("trailClear")
.addEventListener(
    "pointerdown",

    function(event) {

        event.stopPropagation();


        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

    }

);


</script>


</body>
</html>
