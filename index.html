<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Disc Counter</title>

<style>
  * {
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }

  #field {
    position: relative;
    width: 100%;
    height: 100%;
    background: #26951b;
    touch-action: none;
  }

  #controls {
    position: absolute;
    top: 12px;
    left: 0;
    width: 100%;
    z-index: 100;
    pointer-events: none;
  }

  button {
    position: absolute;
    height: 38px;
    border: none;
    border-radius: 7px;
    color: white;
    font-size: 17px;
    font-weight: bold;
    pointer-events: auto;
  }

  #nine {
    left: 40px;
    width: 60px;
    background: #005a10;
  }

  #ten {
    right: 40px;
    width: 60px;
    background: #005a10;
  }

  #clear {
    top: 48px;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    background: #d11e1e;
  }

  .disc {
    position: absolute;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: white;
    transform: translate(-50%, -50%);
    box-shadow: 0 1px 4px rgba(0,0,0,.3);
    animation: pop .4s ease;
    z-index: 10;
  }

  @keyframes pop {
    0%   { transform: translate(-50%, -50%) scale(.3); }
    50%  { transform: translate(-50%, -50%) scale(1.5); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }

  .remaining {
    position: absolute;
    transform: translate(-50%, -50%);
    color: rgba(255,255,255,.65);
    font-size: 22px;
    font-weight: bold;
    pointer-events: none;
    z-index: 20;
  }
</style>
</head>

<body>

<div id="field">

  <div id="controls">
    <button id="nine">9</button>
    <button id="ten">10</button>
    <button id="clear">Clear</button>
  </div>

</div>

<script>

const field = document.getElementById("field");

let selectedCount = 9;
let discs = [];

let lastX = window.innerWidth / 2;
let lastY = window.innerHeight / 2;

function vibrate() {
  if (navigator.vibrate) {
    navigator.vibrate(20);
  }
}

function updateLabel(x = lastX, y = lastY) {

  document.querySelectorAll(".remaining").forEach(el => el.remove());

  const remaining = selectedCount - discs.length;

  const label = document.createElement("div");
  label.className = "remaining";
  label.textContent = remaining;

  label.style.left = x + "px";
  label.style.top = (y - 35) + "px";

  field.appendChild(label);

  lastX = x;
  lastY = y;
}

function addDisc(x, y) {

  const disc = document.createElement("div");
  disc.className = "disc";

  disc.style.left = x + "px";
  disc.style.top = y + "px";

  disc.addEventListener("pointerdown", function(e) {

    e.stopPropagation();

    disc.style.transition = "opacity .3s, transform .3s";
    disc.style.opacity = "0";
    disc.style.transform =
      "translate(-50%, -50%) scale(.2)";

    discs = discs.filter(d => d !== disc);

    updateLabel(x, y);
    vibrate();

    setTimeout(() => disc.remove(), 300);

  });

  field.appendChild(disc);
  discs.push(disc);

  updateLabel(x, y);
  vibrate();
}

field.addEventListener("pointerdown", function(e) {

  if (e.target.tagName === "BUTTON") return;

  addDisc(e.clientX, e.clientY);

});

document.getElementById("nine").onclick = function(e) {

  e.stopPropagation();

  selectedCount = 9;
  updateLabel();

};

document.getElementById("ten").onclick = function(e) {

  e.stopPropagation();

  selectedCount = 10;
  updateLabel();

};

document.getElementById("clear").onclick = function(e) {

  e.stopPropagation();

  discs.forEach(d => d.remove());
  discs = [];

  selectedCount = 9;

  document.querySelectorAll(".remaining")
    .forEach(el => el.remove());

  vibrate();

};

</script>

</body>
</html>
