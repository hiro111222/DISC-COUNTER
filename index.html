<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">

<title>Disc Counter</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #26951b;

    touch-action: none;

    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;

    font-family: Helvetica, Arial, sans-serif;
}

#field {
    position: fixed;
    inset: 0;
    background: #26951b;
}


/* ==============================
   ボタン
   ============================== */

.control {
    position: fixed;
    z-index: 1000;

    border: none;

    color: white;

    font-family: Helvetica, Arial, sans-serif;
    font-size: 16px;

    height: 30px;

    border-radius: 5px;

    padding: 0;

    -webkit-appearance: none;
}


/* 9 */

#btn9 {

    top: 10px;

    left: 50px;

    width: 50px;

    background: #005a10;
}


/* 10 */

#btn10 {

    top: 10px;

    right: 50px;

    width: 50px;

    background: #005a10;
}


/* Clear */

#clear {

    top: 40px;

    left: 50%;

    width: 100px;

    margin-left: -50px;

    background: #d11e1e;
}



/* ==============================
   白丸
   ============================== */

.disc {

    position: absolute;

    width: 32px;
    height: 32px;

    border-radius: 50%;

    background: white;

    transform:
        translate(-50%, -50%)
        scale(1);

    box-shadow:
        0 1px 2px
        rgba(0,0,0,0.25);

    z-index: 10;

    animation:
        discPop 0.4s ease;
}


/* Pythonista
   1 → 1.5 → 1
*/

@keyframes discPop {

    0% {

        transform:
            translate(-50%, -50%)
            scale(1);

    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.5);

    }

    100% {

        transform:
            translate(-50%, -50%)
            scale(1);

    }
}



/* ==============================
   使用済みの丸

   Pythonista
   fade_to(0.1, 0.5)
   ============================== */

.disc.used {

    opacity: 0.1;

    transition:
        opacity 0.5s;

    /*
       薄くした丸を
       再タップしない
    */

    pointer-events: none;
}



/* ==============================
   残り枚数
   ============================== */

#remaining {

    position: absolute;

    transform:
        translate(-50%, -50%);

    color:
        rgba(255,255,255,0.5);

    font-family:
        Helvetica,
        Arial,
        sans-serif;

    font-size: 20px;

    pointer-events: none;

    z-index: 50;
}

</style>
</head>



<body>


<div id="field"></div>


<button
    id="btn9"
    class="control">
    9
</button>


<button
    id="btn10"
    class="control">
    10
</button>


<button
    id="clear"
    class="control">
    Clear
</button>



<script>


/* ==============================
   基本設定
   ============================== */

const field =
    document.getElementById("field");


const remainingLabel =
    document.createElement("div");


remainingLabel.id =
    "remaining";


field.appendChild(
    remainingLabel
);



/*
  Pythonista版と同じ
*/

let selectedCount = 9;


/*
  現在有効な丸
*/

let activeObjects = [];


/*
  画面上に存在する
  全ての丸

  薄くなった丸も含む
*/

let allObjects = [];


let labelX = 0;
let labelY = 0;



/* ==============================
   音
   ============================== */

let audioContext = null;


function clickSound(
    frequency = 700,
    duration = 0.04
) {

    try {

        if (!audioContext) {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }


        const oscillator =
            audioContext.createOscillator();


        const gain =
            audioContext.createGain();


        oscillator.type =
            "sine";


        oscillator.frequency.value =
            frequency;


        gain.gain.setValueAtTime(
            0.06,
            audioContext.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime +
            duration
        );


        oscillator.connect(gain);


        gain.connect(
            audioContext.destination
        );


        oscillator.start();


        oscillator.stop(
            audioContext.currentTime +
            duration
        );


    } catch(e) {

    }

}



/* ==============================
   残り枚数表示
   ============================== */

function updateLabel() {


    const remaining =

        selectedCount -
        activeObjects.length;


    remainingLabel.textContent =
        remaining;


    remainingLabel.style.left =
        labelX + "px";


    /*
      Pythonistaは
      y + 30

      Webでは上下が逆なので
      -30
    */

    remainingLabel.style.top =
        (labelY - 30) + "px";


    remainingLabel.style.display =
        "block";

}



/* ==============================
   丸を置く
   ============================== */

function addObject(x, y) {


    const object =
        document.createElement("div");


    object.className =
        "disc";


    object.style.left =
        x + "px";


    object.style.top =
        y + "px";


    field.appendChild(
        object
    );


    /*
      有効な丸として登録
    */

    activeObjects.push(
        object
    );


    /*
      Clear用に
      全丸リストにも登録
    */

    allObjects.push(
        object
    );



    /* ==========================
       丸をタップ
       ========================== */

    object.addEventListener(
        "pointerdown",

        function(event) {


            event.stopPropagation();


            /*
              使用済みなら
              何もしない
            */

            if (
                object.classList.contains(
                    "used"
                )
            ) {

                return;

            }



            /*
              Pythonista

              fade_to(
                  0.1,
                  0.5
              )

              と同じ
            */

            object.classList.add(
                "used"
            );



            /*
              有効丸から削除

              ただし画面からは
              消さない
            */

            activeObjects =

                activeObjects.filter(

                    item =>
                        item !== object

                );



            /*
              ラベル位置を
              この丸の位置へ
            */

            labelX = x;
            labelY = y;


            updateLabel();



            /*
              削除時の音
            */

            clickSound(
                450,
                0.05
            );


        }

    );



    /*
      最後に置いた位置
    */

    labelX = x;
    labelY = y;


    updateLabel();



    /*
      追加時の音
    */

    clickSound(
        800,
        0.04
    );

}



/* ==============================
   緑部分をタップ
   ============================== */

field.addEventListener(
    "pointerdown",

    function(event) {


        addObject(

            event.clientX,

            event.clientY

        );


    }

);



/* ==============================
   9ボタン
   ============================== */

document
.getElementById("btn9")
.addEventListener(

    "pointerdown",

    function(event) {


        event.stopPropagation();


        selectedCount = 9;


        updateLabel();


    }

);



/* ==============================
   10ボタン
   ============================== */

document
.getElementById("btn10")
.addEventListener(

    "pointerdown",

    function(event) {


        event.stopPropagation();


        selectedCount = 10;


        updateLabel();


    }

);



/* ==============================
   Clear
   ============================== */

document
.getElementById("clear")
.addEventListener(

    "pointerdown",

    function(event) {


        event.stopPropagation();



        /*
          薄くなった丸も含め
          全部削除
        */

        allObjects.forEach(

            object => {

                object.remove();

            }

        );



        /*
          リストもリセット
        */

        activeObjects = [];

        allObjects = [];



        /*
          Pythonista版と同じ
          9へ戻す
        */

        selectedCount = 9;



        /*
          ラベル位置も
          初期化
        */

        labelX = 0;
        labelY = 0;



        /*
          Pythonista版に合わせ
          Clear後のラベルを更新
        */

        updateLabel();


        clickSound(
            350,
            0.05
        );


    }

);


</script>


</body>
</html>
